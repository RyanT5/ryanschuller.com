{{- if .IsHome }}
<nav class="navigation">
  {{ else }}
  <nav class="home-bg navigation">
    {{ end }}
    <section class="container">
      {{ if .IsHome }}
      <span class="navigation-title">
        Welcome to my site!
      </span>
      {{ else }}
      <a class="mobile-navigation-title" href="{{ .Site.BaseURL | relLangURL }}">
        {{ .Site.Title }}
      </a>
      <ul class="navigation-list">
        <li class="navigation-item">
          <a class="cl-effect-3 navigation-title" href="{{ .Site.BaseURL | relLangURL }}">
            {{ .Site.Title }}
          </a>
        </li>
      </ul>
      {{ end }}
      {{ if .Site.Menus.main }}
      <input type="checkbox" id="menu-toggle" />
      <label class="menu-button float-right" for="menu-toggle"><i class="fa fa-bars"></i></label>
      <ul class="navigation-list">
        {{ with .Site.Menus.main}}
        {{ range sort . }}
        <li class="navigation-item">
          <a class="cl-effect-3 navigation-link" href="{{ .URL | absLangURL }}">{{ .Name }}</a>
        </li>
        {{ end }}
        {{ end }}
      </ul>
      {{ end }}
    </section>
  </nav>
